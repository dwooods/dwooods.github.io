baseURL = "https://dwooods.github.io/"
theme = "LoveIt"

languageCode = "en"
languageName = "English"
title = "David Woods"

copyright = "David Woods"
enableRobotsTXT = true
enableEmoji = true
enableGitInfo = false

[pagination]
  pagerSize = 10

[menu]
  [[menu.main]]
    weight = 1
    identifier = "about"
    name = "About"
    url = "/about/"
  [[menu.main]]
    weight = 2
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
  [[menu.main]]
    weight = 3
    identifier = "tags"
    name = "Tags"
    url = "/tags/"

[params]
  defaultTheme = "auto"
  title = "David Woods"
  description = "Notes from hardware, software, and whatever else I'm building."
  images = []

  [params.author]
    name = "David Woods"
    email = ""
    link = "https://github.com/dwooods"

  [params.header]
    desktopMode = "fixed"
    mobileMode = "auto"
    [params.header.title]
      name = "David Woods"
      typeit = false

  [params.footer]
    enable = true
    hugo = false
    copyright = true
    author = true
    since = 2026

  # Fuse.js client-side search, no external service needed
  [params.search]
    enable = true
    type = "fuse"
    contentLength = 4000
    maxResultLength = 10

  [params.home]
    [params.home.profile]
      enable = true
      # Using the GitHub-hosted profile photo for dwooods so there's no broken
      # image before a real headshot is added — swap avatarURL for your own
      # image (e.g. "/images/avatar.png" under static/) whenever you want.
      avatarURL = "/images/avatar.jpg"
      title = "Building things, solving problems, and figuring out what AI can do"
      subtitle = "I'm a product builder who likes turning ideas into things that actually work. I'm exploring what happens when AI handles more of the implementation and I spend more time deciding what to build, solving problems, and testing ideas.<br><br>Sometimes that means wiring up a Raspberry Pi. Sometimes it means building an MCP server for my fantasy football league. Either way, I'm interested in the same thing: using AI to turn ideas into useful things — and having some fun along the way.<br><br>This is where I document what I build, what I learn, and what doesn't quite go according to plan."
      typeit = false
      social = true
    [params.home.posts]
      enable = true
      paginate = 6

  [params.social]
    GitHub = "https://github.com/dwooods"
    Linkedin = "https://www.linkedin.com/in/woodsdavid/"
    RSS = "true"

  [params.page]
    [params.page.toc]
      enable = true
      keepStatic = false
      auto = true
    [params.page.code]
      copy = true
      maxShownLines = 50
       render = { mermaid = true } # Useful for architecture flowcharts in posts like the LED strip one
       
    # Comments framework is on; giscus itself stays off until it's configured
    # (see the setup steps in the giscus block below).
    [params.page.comment]
      enable = true
      [params.page.comment.giscus]
        enable = false
        # Setup, when ready:
        #   1. Enable "Discussions" on the dwooods.github.io repo
        #      (Settings -> General -> Features).
        #   2. Install the giscus GitHub App: https://github.com/apps/giscus
        #   3. Get repoId/categoryId from https://giscus.app (it reads the
        #      repo and fills these in for you) and paste them below.
        #   4. Flip enable = true here.
        repo = "dwooods/dwooods.github.io"
        repoId = ""
        category = "Comments"
        categoryId = ""
        mapping = "pathname"
        reactionsEnabled = "1"
        inputPosition = "bottom"
        lightTheme = "light"
        darkTheme = "dark"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 6
