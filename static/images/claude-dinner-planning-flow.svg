<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="1600" height="587" role="img" aria-label="Flow from the plan document and calendar through an AI assistant and my Cloudflare Worker to Skylight, with a person approving each write">
  <rect width="900" height="330" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <g font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#222" text-anchor="middle">
    <rect x="20" y="40" width="170" height="70" rx="8" fill="#f3f3f3" stroke="#888"/>
    <text x="105" y="70">Plan document</text><text x="105" y="92" font-size="13" fill="#555">(a shared doc)</text>

    <rect x="20" y="200" width="170" height="70" rx="8" fill="#f3f3f3" stroke="#888"/>
    <text x="105" y="230">Family calendar</text><text x="105" y="252" font-size="13" fill="#555">(read-only check)</text>

    <rect x="260" y="105" width="170" height="90" rx="8" fill="#e8f0fe" stroke="#4a6fa5"/>
    <text x="345" y="140">AI assistant (Duet)</text><text x="345" y="162" font-size="13" fill="#555">standing instructions</text><text x="345" y="180" font-size="13" fill="#555">(2,000 characters)</text>

    <rect x="500" y="105" width="170" height="90" rx="8" fill="#fff4e0" stroke="#b07a1f"/>
    <text x="585" y="140">My MCP server</text><text x="585" y="162" font-size="13" fill="#555">Cloudflare Worker</text><text x="585" y="180" font-size="13" fill="#555">checks text, limits writes</text>

    <rect x="720" y="105" width="160" height="90" rx="8" fill="#eaf5ea" stroke="#4d8a4d"/>
    <text x="800" y="140">Skylight</text><text x="800" y="162" font-size="13" fill="#555">wall display</text><text x="800" y="180" font-size="13" fill="#555">and phone app</text>

    <rect x="240" y="255" width="210" height="50" rx="8" fill="#ffffff" stroke="#444" stroke-dasharray="5 4"/>
    <text x="345" y="285">Me: a yes to the exact text</text>
  </g>
  <g stroke="#444" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M190,75 L260,135"/>
    <path d="M190,235 L260,170"/>
    <path d="M430,150 L500,150"/>
    <path d="M670,150 L720,150"/>
    <path d="M345,255 L345,197"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555" text-anchor="middle">
    <text x="465" y="140">tool calls</text>
    <text x="695" y="140">writes</text>
  </g>
</svg>
