<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#DD6B20"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3182CE"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="820" fill="#FFFFFF"/>

  <text x="600" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#1A202C">Watching a Movie on the Phone, From the Vacation Home</text>
  <text x="600" y="62" text-anchor="middle" font-size="14" fill="#718096">Simplified view of the data path — not to scale</text>

  <!-- LEFT PANEL: Vacation Home -->
  <rect x="50" y="90" width="330" height="530" rx="20" fill="#EBF8FF" stroke="#90CDF4" stroke-width="2"/>
  <g transform="translate(90,120)">
    <path d="M0,20 L0,4 Q0,-10 10,-10 Q6,-4 8,4 Q14,-2 18,2 Q12,6 16,12 Q20,10 22,16 Q14,16 12,20 Z" fill="#38A169"/>
    <line x1="0" y1="20" x2="0" y2="4" stroke="#8B5A2B" stroke-width="3"/>
  </g>
  <text x="215" y="128" text-anchor="middle" font-size="17" font-weight="700" fill="#2B6CB0">VACATION HOME</text>
  <text x="215" y="148" text-anchor="middle" font-size="12" fill="#4A5568">(someone else's internet, no router access)</text>

  <!-- travel router icon -->
  <g transform="translate(215,210)">
    <line x1="-18" y1="-10" x2="-30" y2="-38" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
    <line x1="18" y1="-10" x2="30" y2="-38" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
    <rect x="-38" y="-10" width="76" height="32" rx="7" fill="#4A5568"/>
    <circle cx="-20" cy="6" r="3" fill="#68D391"/>
    <circle cx="0" cy="6" r="3" fill="#68D391"/>
    <circle cx="20" cy="6" r="3" fill="#68D391"/>
  </g>
  <text x="215" y="266" text-anchor="middle" font-size="13" font-weight="600" fill="#2D3748">Travel router</text>
  <text x="215" y="283" text-anchor="middle" font-size="12" fill="#4A5568">(GL.iNet, running Tailscale)</text>

  <!-- phone icon -->
  <g transform="translate(150,390)">
    <rect x="-28" y="-52" width="56" height="104" rx="10" fill="#2D3748"/>
    <rect x="-22" y="-43" width="44" height="78" rx="2" fill="#EDF2F7"/>
    <circle cx="0" cy="42" r="5" fill="#1A202C"/>
    <path d="M-8,-10 L4,-2 L-8,6 Z" fill="#4299E1"/>
  </g>
  <text x="150" y="460" text-anchor="middle" font-size="13" font-weight="600" fill="#2D3748">Phone (Plex app)</text>

  <!-- TV icon -->
  <g transform="translate(295,390)">
    <rect x="-58" y="-40" width="116" height="72" rx="6" fill="#2D3748"/>
    <rect x="-50" y="-33" width="100" height="58" rx="2" fill="#EDF2F7"/>
    <path d="M-10,-8 L8,4 L-10,16 Z" fill="#4299E1"/>
    <rect x="-8" y="32" width="16" height="14" fill="#2D3748"/>
    <rect x="-30" y="46" width="60" height="6" rx="3" fill="#2D3748"/>
  </g>
  <text x="295" y="470" text-anchor="middle" font-size="13" font-weight="600" fill="#2D3748">Smart TV</text>

  <!-- wifi dashed lines phone/tv to router -->
  <path d="M170,345 Q190,300 205,240" fill="none" stroke="#A0AEC0" stroke-width="2.5" stroke-dasharray="2,6" stroke-linecap="round"/>
  <path d="M285,345 Q260,300 225,240" fill="none" stroke="#A0AEC0" stroke-width="2.5" stroke-dasharray="2,6" stroke-linecap="round"/>
  <text x="215" y="345" text-anchor="middle" font-size="11" fill="#718096">local Wi-Fi</text>

  <!-- RIGHT PANEL: Permanent Home -->
  <rect x="820" y="90" width="330" height="530" rx="20" fill="#F0FFF4" stroke="#9AE6B4" stroke-width="2"/>
  <g transform="translate(860,118)">
    <path d="M0,16 L0,-2 L14,-16 L28,-2 L28,16 Z" fill="#276749"/>
  </g>
  <text x="985" y="128" text-anchor="middle" font-size="17" font-weight="700" fill="#276749">PERMANENT HOME</text>
  <text x="985" y="148" text-anchor="middle" font-size="12" fill="#4A5568">(where the movies actually live)</text>

  <!-- home router -->
  <g transform="translate(985,210)">
    <line x1="-18" y1="-10" x2="-30" y2="-38" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
    <line x1="18" y1="-10" x2="30" y2="-38" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
    <rect x="-38" y="-10" width="76" height="32" rx="7" fill="#4A5568"/>
    <circle cx="-20" cy="6" r="3" fill="#68D391"/>
    <circle cx="0" cy="6" r="3" fill="#68D391"/>
    <circle cx="20" cy="6" r="3" fill="#68D391"/>
  </g>
  <text x="985" y="266" text-anchor="middle" font-size="13" font-weight="600" fill="#2D3748">Home router</text>

  <!-- ethernet line router to NAS -->
  <line x1="985" y1="234" x2="985" y2="300" stroke="#4A5568" stroke-width="3"/>

  <!-- NAS / server icon -->
  <g transform="translate(985,390)">
    <rect x="-72" y="-72" width="144" height="144" rx="10" fill="#2C5282"/>
    <rect x="-58" y="-54" width="116" height="28" rx="4" fill="#4299E1"/>
    <rect x="-58" y="-16" width="116" height="28" rx="4" fill="#4299E1"/>
    <rect x="-58" y="22" width="116" height="28" rx="4" fill="#4299E1"/>
    <circle cx="46" cy="-40" r="4" fill="#68D391"/>
    <circle cx="46" cy="-2" r="4" fill="#68D391"/>
    <circle cx="46" cy="36" r="4" fill="#68D391"/>
  </g>
  <text x="985" y="480" text-anchor="middle" font-size="13" font-weight="700" fill="#2D3748">Synology NAS</text>
  <text x="985" y="498" text-anchor="middle" font-size="12" fill="#4A5568">running Plex Media Server</text>
  <text x="985" y="516" text-anchor="middle" font-size="11" fill="#718096">(their own movies &amp; TV — no subscriptions)</text>

  <!-- CLOUD / internet in middle -->
  <g>
    <ellipse cx="530" cy="230" rx="55" ry="34" fill="#E2E8F0"/>
    <ellipse cx="600" cy="200" rx="70" ry="44" fill="#E2E8F0"/>
    <ellipse cx="670" cy="230" rx="55" ry="34" fill="#E2E8F0"/>
    <rect x="470" y="220" width="260" height="46" fill="#E2E8F0"/>
  </g>
  <text x="600" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#4A5568">INTERNET</text>
  <g transform="translate(600,232)">
    <rect x="-12" y="-2" width="24" height="20" rx="3" fill="#DD6B20"/>
    <path d="M-8,-2 v-9 a8,8 0 0 1 16,0 v9" fill="none" stroke="#DD6B20" stroke-width="4"/>
  </g>

  <!-- tunnel dashed arrow: travel router -> cloud -> home router -->
  <path d="M 300,210 C 420,150 480,170 545,205" fill="none" stroke="#DD6B20" stroke-width="5" stroke-dasharray="12,9" stroke-linecap="round"/>
  <path d="M 655,205 C 720,170 780,150 870,210" fill="none" stroke="#DD6B20" stroke-width="5" stroke-dasharray="12,9" stroke-linecap="round" marker-end="url(#arrowOrange)"/>
  <text x="600" y="300" text-anchor="middle" font-size="13" font-weight="600" fill="#DD6B20">Encrypted Tailscale tunnel (WireGuard)</text>
  <text x="600" y="318" text-anchor="middle" font-size="11" fill="#975A16">Both sides look like one private network — Plex treats it as "local"</text>

  <!-- bottom sweeping return arrow: NAS -> phone (video stream) -->
  <path d="M 985,465 C 985,700 150,700 150,448" fill="none" stroke="#3182CE" stroke-width="5" fill-opacity="0" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <text x="567" y="722" text-anchor="middle" font-size="14" font-weight="700" fill="#3182CE">The movie streams back down the same tunnel to the phone or TV</text>

  <!-- Legend -->
  <line x1="330" y1="765" x2="380" y2="765" stroke="#A0AEC0" stroke-width="2.5" stroke-dasharray="2,6"/>
  <text x="392" y="769" font-size="12" fill="#4A5568">Local Wi-Fi at each location</text>

  <line x1="330" y1="787" x2="380" y2="787" stroke="#DD6B20" stroke-width="5" stroke-dasharray="8,6"/>
  <text x="392" y="791" font-size="12" fill="#4A5568">Encrypted Tailscale tunnel over the public internet</text>

  <line x1="330" y1="809" x2="380" y2="809" stroke="#3182CE" stroke-width="5"/>
  <text x="392" y="813" font-size="12" fill="#4A5568">Direction the video actually streams</text>
</svg>
