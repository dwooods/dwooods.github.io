services:
  modem-monitor:
    image: python:3.12-slim
    container_name: modem-monitor
    command: ["python", "-u", "/app/monitor.py"]
    restart: unless-stopped
    env_file: stack.env
    ports:
      - "8088:8088"
    volumes:
      - /volume1/docker/modem-monitor/monitor.py:/app/monitor.py:ro
      - /volume1/docker/modem-monitor/data:/data
      - /etc/localtime:/etc/localtime:ro
